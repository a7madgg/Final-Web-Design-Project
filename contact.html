<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - YU store</title>
  <link rel="stylesheet" href="MyStyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <header>
    <div class="container nav">
  <a href="index.html" class="logo-wrap">
    <span class="logo-text">YU store</span>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="product.html">Products</a>
    <a href="index.html" class="active">Contact</a>
  </nav>

  <button id="themeBtn">Dark Mode</button>
</div>
  </header>

  <main class="container page">
    <h1>Contact Us</h1>
    <p>Fill the form and we will respond (demo for CIS 201).</p>

    <form id="contactForm" class="form">
      <label>Email</label>
      <input type="email" id="email" placeholder="example@domain.com">

      <label>Gender</label>
      <select id="gender">
        <option value="">Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="prefer">Prefer not to say</option>
      </select>

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="05xxxxxxxx" maxlength="10">

      <label>Complaint / Question</label>
      <textarea id="message" rows="5" placeholder="Write your complaint or question..."></textarea>

      <button type="submit" class="btn">Send</button>
      <p id="formMsg"></p>
    </form>

    <div class="contact-social">
      <h3>Follow Us</h3>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> Instagram</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="https://x.com/" target="_blank" rel="noopener"><i class="fa-brands fa-x-twitter"></i> X</a>
    </div>
  </main>

  <footer>
    <p>Students name:</p>
    <p>Ahmad Ghanoum | Saad Abahuss | Faisal Alzeer</p>
    <p>Course: Fundamentals Web Design - CIS 201</p>
    <p>© Al Yamamah University 2026</p>

  </footer>

  <script src="Myjs.js"></script>
</body>
</html>
